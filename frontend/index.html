<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ces balises sont celles du repli. Le prérendu les réécrit par page,
         dans frontend/prerender.mjs, à partir de routes.json et du
         dictionnaire : ce que voit un robot n'est donc pas ce bloc, sauf sur
         une URL inconnue.

         Une balise par ligne, et ce fichier est exclu de Prettier, parce que
         Prettier coupait les balises sur plusieurs lignes et que le motif du
         prérendu ne trouvait plus og:description. Le prérendu échoue désormais
         si une balise attendue manque. -->
    <title>piighost - dé-identifier les données personnelles avant un LLM</title>
    <meta name="description" content="piighost masque les données personnelles avant un LLM, puis restaure les vraies valeurs. Pseudonymisation réversible, souvent appelée anonymisation." />
    <link rel="canonical" href="https://piighost.dev/fr" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Une seule valeur, sans `media` : le thème du site vient de la classe
         posée par theme.js depuis localStorage, jamais du système. Conditionner
         la couleur de chrome au système donnait une barre d'adresse sombre
         au-dessus d'une page claire, ce que la charte interdit. -->
    <meta name="theme-color" content="oklch(0.155 0.010 220)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="piighost" />
    <meta property="og:title" content="piighost - dé-identifier les données personnelles avant un LLM" />
    <meta property="og:description" content="piighost masque les données personnelles avant un LLM, puis restaure les vraies valeurs. Pseudonymisation réversible, souvent appelée anonymisation." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://piighost.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le logo de piighost, un fantôme, au-dessus de la phrase en anglais « Everything the model can do. Nothing it doesn't need to know. »" />
    <meta property="og:url" content="https://piighost.dev/fr" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="piighost - dé-identifier les données personnelles avant un LLM" />
    <meta name="twitter:description" content="piighost masque les données personnelles avant un LLM, puis restaure les vraies valeurs. Pseudonymisation réversible, souvent appelée anonymisation." />

    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
