<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ces balises sont celles du repli. Le prérendu les réécrit par page,
         dans frontend/prerender.mjs, à partir de routes.json et du
         dictionnaire : ce que voit un robot n'est donc pas ce bloc, sauf sur
         une URL inconnue. -->
    <title>
      piighost - anonymiser les PII avant qu'elles n'atteignent le modèle
    </title>
    <meta
      name="description"
      content="piighost est une librairie Python pour anonymiser les informations personnelles avant qu'elles n'atteignent un grand modèle de langage."
    />
    <link rel="canonical" href="https://piighost.dev/fr" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Une seule valeur, sans `media` : le thème du site vient de la classe
         posée par theme.js depuis localStorage, jamais du système. Conditionner
         la couleur de chrome au système donnait une barre d'adresse sombre
         au-dessus d'une page claire, ce que la charte interdit. -->
    <meta name="theme-color" content="#f6f8f9" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="piighost" />
    <meta property="og:title" content="piighost" />
    <meta
      property="og:description"
      content="Anonymize PII before it reaches the LLM."
    />
    <meta property="og:image" content="https://piighost.dev/og.png" />
    <meta property="og:url" content="https://piighost.dev/fr" />
    <meta name="twitter:card" content="summary_large_image" />

    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
